[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# Focus on real defects and security-relevant issues.
select = ["E", "F", "W", "I", "UP", "B", "BLE", "SIM", "TRY", "S", "PLW", "RUF"]
ignore = [
    "UP017",   # datetime.UTC alias requires 3.11+; timezone.utc is broadly compatible
    "TRY004",  # ValueError is semantically correct for corrupt/loaded data
    "TRY003",  # user-facing error messages are intentionally inline and descriptive
    "TRY301",  # raising inside a parse block is deliberate
    "TRY400",  # expected LLM failures are logged without a full traceback
    "TRY300",  # returning from within a validation try-block is clearer here
    "S603",    # subprocess with a fixed argv list and shell=False is intentional
    "S607",    # tool binaries are resolved via shutil.which or absolute paths
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "RUF059",  # unpacking fixture-like tuples is fine in tests
    "SIM117",  # nested with-statements are clearer in test setup
    "F841",    # captured locals for assertion context
    "S101",    # assert is the point of tests
    "E501",    # long assertion strings
]
"gryphos/logging_setup.py" = ["BLE001", "SIM108"]
"gryphos/agent.py" = ["BLE001"]
"gryphos/llm.py" = ["E501"]  # system prompt embeds long JSON schema examples

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
